name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novapatch
          POSTGRES_PASSWORD: novapatch
          POSTGRES_DB: novapatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novapatch -d novapatch"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    env:
      DATABASE_URL: postgres://novapatch:novapatch@localhost:5432/novapatch
      DATABASE_URL_TEST: postgres://novapatch:novapatch@localhost:5432/novapatch_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: >
          PGPASSWORD=novapatch psql -h localhost -U novapatch -d novapatch
          -c 'CREATE DATABASE novapatch_test;'

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
